<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" x2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#be123c"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Noto Sans SC", "Microsoft YaHei", sans-serif;
        fill: #0f172a;
        text-rendering: geometricPrecision;
      }
      .title { font-size: 34px; font-weight: 850; }
      .subtitle { font-size: 15px; font-weight: 560; fill: #475569; }
      .axis { font-size: 22px; font-weight: 850; fill: #ffffff; }
      .axisSub { font-size: 13px; font-weight: 650; fill: #e0f2fe; }
      .centerTitle { font-size: 24px; font-weight: 900; }
      .centerText { font-size: 14px; font-weight: 650; fill: #334155; }
      .nodeTitle { font-size: 16px; font-weight: 850; }
      .nodeText { font-size: 12px; font-weight: 560; fill: #475569; }
      .outcomeTitle { font-size: 16px; font-weight: 850; }
      .outcomeText { font-size: 13px; font-weight: 650; fill: #475569; }
    </style>
  </defs>

  <rect width="1080" height="680" fill="url(#bg)"/>
  <text class="title" x="540" y="54" text-anchor="middle">Research Topics and Goals</text>
  <text class="subtitle" x="540" y="82" text-anchor="middle">Building efficient, reliable, and scalable modern AI systems</text>

  <rect x="44" y="118" width="372" height="76" rx="14" fill="url(#blue)" filter="url(#softShadow)"/>
  <text class="axis" x="230" y="150" text-anchor="middle">Modern AI Systems</text>
  <text class="axisSub" x="230" y="176" text-anchor="middle">LLMs · Diffusion · World Models · RL</text>

  <rect x="664" y="118" width="372" height="76" rx="14" fill="url(#rose)" filter="url(#softShadow)"/>
  <text class="axis" x="850" y="150" text-anchor="middle">Theoretical ML Foundations</text>
  <text class="axisSub" x="850" y="176" text-anchor="middle">Monte Carlo · VI · Bayesian Inverse Problems</text>

  <rect x="368" y="274" width="344" height="130" rx="20" fill="#ffffff" stroke="#c7d2fe" stroke-width="2" filter="url(#softShadow)"/>
  <text class="centerTitle" x="540" y="320" text-anchor="middle">Efficient &amp; Reliable Modern AI</text>
  <text class="centerText" x="540" y="351" text-anchor="middle">Learning algorithms, inference, and decision-making</text>
  <text class="centerText" x="540" y="377" text-anchor="middle">for capable AI systems</text>

  <path d="M416 174 C492 198 520 236 510 274" fill="none" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)" opacity="0.76"/>
  <path d="M664 174 C588 198 560 236 570 274" fill="none" stroke="#be123c" stroke-width="3.5" marker-end="url(#arrowRose)" opacity="0.76"/>

  <g filter="url(#softShadow)">
    <rect x="64" y="236" width="256" height="84" rx="13" fill="#ffffff" stroke="#dbeafe"/>
    <text class="nodeTitle" x="88" y="270">LLM Architecture &amp; Memory</text>
    <text class="nodeText" x="88" y="295">gated delta net generalization · attention</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="74" y="352" width="246" height="84" rx="13" fill="#ffffff" stroke="#dbeafe"/>
    <text class="nodeTitle" x="98" y="386">LLM Post-train &amp; RL</text>
    <text class="nodeText" x="98" y="411">alignment and reinforcement learning</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="96" y="468" width="264" height="84" rx="13" fill="#ffffff" stroke="#dbeafe"/>
    <text class="nodeTitle" x="120" y="502">LLM Inference Acceleration</text>
    <text class="nodeText" x="120" y="527">compression, quantization, deployment</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="382" y="486" width="220" height="84" rx="13" fill="#ffffff" stroke="#dbeafe"/>
    <text class="nodeTitle" x="406" y="520">World Models + RL</text>
    <text class="nodeText" x="406" y="545">model-based learning · diffusion policy</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="760" y="236" width="244" height="84" rx="13" fill="#ffffff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="784" y="270">Monte Carlo Methods</text>
    <text class="nodeText" x="784" y="295">variance reduction · scalable computation</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="762" y="352" width="242" height="84" rx="13" fill="#ffffff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="786" y="386">Variational Inference</text>
    <text class="nodeText" x="786" y="411">Stein methods · probabilistic approximation</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="684" y="468" width="292" height="84" rx="13" fill="#ffffff" stroke="#fecdd3"/>
    <text class="nodeTitle" x="708" y="502">Bayesian Inverse Problems</text>
    <text class="nodeText" x="708" y="527">diffusion posterior sampling · uncertainty</text>
  </g>

  <path d="M320 278 C350 286 360 300 368 316" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)" opacity="0.55"/>
  <path d="M320 394 C344 384 358 370 368 356" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)" opacity="0.55"/>
  <path d="M360 510 C410 474 456 428 480 404" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)" opacity="0.55"/>
  <path d="M492 486 C502 454 516 424 526 404" fill="none" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrowBlue)" opacity="0.5"/>
  <path d="M760 278 C730 286 720 300 712 316" fill="none" stroke="#be123c" stroke-width="2.6" marker-end="url(#arrowRose)" opacity="0.55"/>
  <path d="M762 394 C736 384 722 370 712 356" fill="none" stroke="#be123c" stroke-width="2.6" marker-end="url(#arrowRose)" opacity="0.55"/>
  <path d="M684 510 C636 474 606 430 590 404" fill="none" stroke="#be123c" stroke-width="2.6" marker-end="url(#arrowRose)" opacity="0.55"/>

  <rect x="138" y="604" width="804" height="50" rx="17" fill="#ffffff" stroke="#e2e8f0" filter="url(#softShadow)"/>
  <text class="outcomeTitle" x="540" y="626" text-anchor="middle">Unifying Research Objective</text>
  <text class="outcomeText" x="540" y="647" text-anchor="middle">more efficient, reliable, and scalable AI systems across LLMs, diffusion models, world models, and reinforcement learning</text>
</svg>
